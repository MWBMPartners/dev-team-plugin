name: plugin-audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Model-id + plugin-structure audit
        run: bash scripts/audit-model-ids.sh
      - name: Ledger-path audit (issue #41 — catches a stale top-level ledger path in our own docs)
        run: bash scripts/audit-ledger-paths.sh
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install jq, shellcheck, bats
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck bats
      # Ubuntu 24.04's system Python marks itself "externally managed" (PEP 668), so a plain
      # "pip install" into it is refused rather than silently succeeding — pipx installs into its
      # own isolated environment instead, which Ubuntu allows. pipx itself ships pre-installed on
      # GitHub's hosted Ubuntu runners (confirmed in actions/runner-images' own Ubuntu 24.04
      # tool list, fetched 13 September 2026, which lists "Pipx 1.16.7"), so no extra install step
      # is needed for pipx itself, only for the tool we want it to install.
      - name: Install check-jsonschema via pipx (Ubuntu 24.04's system pip refuses a plain "pip install")
        run: pipx install check-jsonschema
      - name: Smoke test (plugin-structure delivery)
        run: bash tests/smoke-structure.sh
      - name: Shellcheck
        run: shellcheck scripts/*.sh hooks/*.sh tests/*.sh
      - name: Bats (script behavior contracts)
        run: bats tests/scripts.bats
