name: plugin-audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Model-id + plugin-structure audit
        run: bash scripts/audit-model-ids.sh
